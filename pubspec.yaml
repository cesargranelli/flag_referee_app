name: flag_referee_app
description: "Referee App do Flag Platform - operacao de partidas pela mesa (placar e validacao de atletas)."
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.11.4

workspace:
  - packages/*

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flag_core: ^0.3.0
  flag_api: ^0.3.0
  flag_domain: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
